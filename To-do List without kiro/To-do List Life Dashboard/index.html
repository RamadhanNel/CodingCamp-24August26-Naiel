<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div id="datetime">
        <span id="current-time">00:00:00</span>
        <span id="current-date">Monday, 1 January 2026</span>
      </div>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="btn-icon" title="Toggle Light/Dark Mode">🌙</button>
    </div>
  </header>

  <!-- Main -->
  <main class="dashboard">

    <!-- Greeting -->
    <section class="card greeting-card">
      <div class="greeting-top">
        <p id="greeting-text">Good Morning</p>
        <div class="name-row">
          <span id="greeting-name">there</span>
          <button id="edit-name-btn" class="btn-icon" title="Change name">✏️</button>
        </div>
      </div>
      <div id="name-form" class="name-form hidden">
        <input type="text" id="name-input" placeholder="Enter your name..." maxlength="30" />
        <button id="save-name-btn" class="btn btn-primary">Save</button>
      </div>
    </section>

    <!-- Grid layout for timer + todo + links -->
    <div class="grid">

      <!-- Focus Timer -->
      <section class="card timer-card">
        <h2 class="card-title">Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="timer-minutes">
          <label for="custom-minutes">Minutes:</label>
          <input type="number" id="custom-minutes" min="1" max="120" value="25" />
        </div>
        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">Start</button>
          <button id="timer-stop" class="btn btn-secondary">Stop</button>
          <button id="timer-reset" class="btn btn-ghost">Reset</button>
        </div>
      </section>

      <!-- To-Do List -->
      <section class="card todo-card">
        <div class="card-header">
          <h2 class="card-title">To-Do List</h2>
          <select id="sort-select" class="sort-select">
            <option value="default">Default</option>
            <option value="asc">A → Z</option>
            <option value="desc">Z → A</option>
            <option value="done">Done Last</option>
          </select>
        </div>
        <div class="todo-input-row">
          <input type="text" id="todo-input" placeholder="Add a new task..." maxlength="100" />
          <button id="todo-add-btn" class="btn btn-primary">Add</button>
        </div>
        <p id="duplicate-warning" class="warning hidden">Task already exists!</p>
        <ul id="todo-list" class="todo-list"></ul>
      </section>

      <!-- Quick Links -->
      <section class="card links-card">
        <h2 class="card-title">Quick Links</h2>
        <div class="link-input-row">
          <input type="text" id="link-name-input" placeholder="Label" maxlength="20" />
          <input type="url" id="link-url-input" placeholder="https://..." />
          <button id="link-add-btn" class="btn btn-primary">Add</button>
        </div>
        <div id="links-grid" class="links-grid"></div>
      </section>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
