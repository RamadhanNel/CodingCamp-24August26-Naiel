<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
</head>
<body>

  <header class="header">
    <div class="clock">
      <span class="clock__time"></span>
      <span class="clock__date"></span>
    </div>

    <div class="greeting">
      <div class="greeting__display">
        <span class="greeting__salutation"></span>
        <span class="greeting__name"></span>
        <button class="greeting__edit-btn" aria-label="Edit name">&#x270F;&#xFE0F;</button>
      </div>
      <form class="greeting__form hidden" aria-label="Edit name form">
        <input class="greeting__input" type="text" maxlength="30" placeholder="Your name..." aria-label="Enter your name" />
        <button type="submit" class="btn-sm">Save</button>
      </form>
    </div>

    <button class="theme-toggle" aria-label="Switch to dark mode">&#x1F319;</button>
  </header>

  <main class="dashboard-grid">

    <!-- Focus Timer card -->
    <section class="card card--timer" aria-label="Focus Timer">
      <div class="card__header">
        <h2 class="card__title">Focus Timer</h2>
        <label class="pomodoro-toggle">
          <input type="checkbox" id="timer-pomodoro" />
          <span class="pomodoro-toggle__label">Pomodoro</span>
        </label>
      </div>

      <div class="timer__ring-wrap" aria-hidden="true">
        <svg class="timer__ring" viewBox="0 0 120 120">
          <circle class="timer__ring-bg" cx="60" cy="60" r="54" />
          <circle class="timer__progress-circle" cx="60" cy="60" r="54" fill="none" stroke-linecap="round" />
        </svg>
        <span class="timer__display" aria-live="polite" aria-label="Time remaining">25:00</span>
      </div>

      <span class="timer__phase-label" aria-live="polite"></span>

      <div class="timer__controls">
        <button id="timer-start" class="btn-timer btn-start" aria-label="Start timer">Start</button>
        <button id="timer-pause" class="btn-timer btn-pause" aria-label="Pause timer" disabled>Pause</button>
        <button id="timer-stop"  class="btn-timer btn-stop"  aria-label="Stop timer"  disabled>Stop</button>
        <button id="timer-reset" class="btn-timer btn-reset" aria-label="Reset timer">Reset</button>
      </div>

      <div class="timer__duration-row">
        <label class="timer__duration-label" for="timer-duration">Duration (min):</label>
        <input id="timer-duration" type="number" min="1" max="120" value="25" aria-label="Timer duration in minutes" />
      </div>
    </section>

    <!-- To-Do List card -->
    <section class="card card--todo" aria-label="To-Do List">
      <div class="card__header">
        <h2 class="card__title">Tasks</h2>
        <span class="todo__counter" aria-live="polite"></span>
      </div>

      <form class="todo__add-form">
        <input class="todo__input" type="text" maxlength="100" placeholder="Add a new task..." aria-label="New task text" />
        <button type="submit" class="btn-sm" aria-label="Add task">Add</button>
      </form>

      <div class="todo__warning hidden" role="alert"></div>

      <div class="todo__filters" role="group" aria-label="Filter tasks">
        <button class="todo__filter-btn todo__filter-btn--active" data-filter="all"    aria-pressed="true">All</button>
        <button class="todo__filter-btn"                          data-filter="active" aria-pressed="false">Active</button>
        <button class="todo__filter-btn"                          data-filter="done"   aria-pressed="false">Done</button>
      </div>

      <div class="todo__toolbar">
        <label class="todo__sort-label" for="todo-sort">Sort:</label>
        <select id="todo-sort" aria-label="Sort tasks">
          <option value="default">Default</option>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A to Z</option>
          <option value="za">Z to A</option>
          <option value="done-last">Active first</option>
          <option value="done-first">Done first</option>
        </select>
      </div>

      <ul class="todo__list" aria-live="polite" aria-label="Task list"></ul>
    </section>

    <!-- Quick Links card -->
    <section class="card card--links" aria-label="Quick Links">
      <h2 class="card__title">Quick Links</h2>
      <form class="links__add-form">
        <input class="links__label-input" type="text" maxlength="20" placeholder="Label" aria-label="Link label" />
        <input class="links__url-input" type="url" placeholder="https://..." aria-label="Link URL" />
        <button type="submit" class="btn-sm" aria-label="Add link">Add</button>
      </form>
      <div class="links__grid" role="list" aria-label="Quick links"></div>
    </section>

  </main>

</body>
</html>
